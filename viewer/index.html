<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 Brain Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; padding: 24px; }
  h1 { font-size: 24px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .subtitle { color: #8b949e; margin-bottom: 24px; font-size: 14px; }
  .status { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .status.online { background: #1a3a2a; color: #3fb950; }
  .status.offline { background: #3a1a1a; color: #f85149; }
  .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
  .search-box input { flex: 1; padding: 10px 16px; border: 1px solid #30363d; border-radius: 8px; background: #161b22; color: #c9d1d9; font-size: 14px; }
  .search-box button { padding: 10px 20px; border: none; border-radius: 8px; background: #238636; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  .search-box button:hover { background: #2ea043; }
  .layers { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .layer-btn { padding: 6px 16px; border: 1px solid #30363d; border-radius: 16px; background: transparent; color: #c9d1d9; font-size: 13px; cursor: pointer; }
  .layer-btn.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .layer-btn:hover { border-color: #58a6ff; }
  .results { display: flex; flex-direction: column; gap: 8px; }
  .note { padding: 16px; border: 1px solid #30363d; border-radius: 8px; background: #161b22; }
  .note-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .note-path { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; color: #58a6ff; }
  .note-layer { font-size: 11px; padding: 2px 8px; border-radius: 8px; background: #1f6feb22; color: #58a6ff; font-weight: 600; text-transform: uppercase; }
  .note-score { font-size: 12px; color: #8b949e; }
  .note-snippet { font-size: 13px; color: #8b949e; line-height: 1.5; margin-top: 4px; white-space: pre-wrap; }
  .empty { text-align: center; padding: 48px; color: #484f58; }
  .error { text-align: center; padding: 24px; color: #f85149; }
  .loading { text-align: center; padding: 24px; color: #8b949e; }
  footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid #21262d; font-size: 12px; color: #484f58; text-align: center; }
</style>
</head>
<body>
<h1>🧠 Brain Viewer</h1>
<div class="subtitle">
  <span class="status" id="status">Checking connection...</span>
</div>

<div class="search-box">
  <input type="text" id="query" placeholder="Search the brain..." onkeydown="if(event.key==='Enter') search()">
  <button onclick="search()">Search</button>
  <button onclick="browseAll()" style="background:#1f6feb;">Browse All</button>
</div>

<div class="layers">
  <button class="layer-btn active" data-layer="" onclick="setLayer(this, '')">All</button>
  <button class="layer-btn" data-layer="arquitetura" onclick="setLayer(this, 'arquitetura')">Arquitetura</button>
  <button class="layer-btn" data-layer="regras" onclick="setLayer(this, 'regras')">Regras</button>
  <button class="layer-btn" data-layer="sessoes" onclick="setLayer(this, 'sessoes')">Sessões</button>
  <button class="layer-btn" data-layer="projetos" onclick="setLayer(this, 'projetos')">Projetos</button>
</div>

<div id="results" class="results">
  <div class="empty">🔍 Search the brain to see results here</div>
</div>

<footer>
  Brain MCP Server — <span id="brain-url">http://localhost:8321</span>
</footer>

<script>
// The viewer server runs on port 8322 by default (BRAIN_VIEWER_PORT)
const API_BASE = location.origin;
document.getElementById('brain-url').textContent = API_BASE;

let currentLayer = '';

async function checkStatus() {
  const statusEl = document.getElementById('status');
  try {
    const resp = await fetch(`${API_BASE}/api/status`, { signal: AbortSignal.timeout(3000) });
    if (resp.ok) {
      const data = await resp.json();
      statusEl.className = 'status online';
      const ollama = data.ollama_ok ? '🟢' : '🟡';
      statusEl.textContent = `🟢 Online · ${data.index_entries} entries · Ollama ${ollama}`;
    }
  } catch {
    statusEl.className = 'status offline';
      statusEl.textContent = '🔴 Viewer offline';
  }
}

async function browseAll() {
  const resultsEl = document.getElementById('results');
  resultsEl.innerHTML = '<div class="loading">⏳ Loading notes...</div>';

  try {
    const resp = await fetch(`${API_BASE}/api/list`);
    const data = await resp.json();

    if (data.error) {
      resultsEl.innerHTML = `<div class="error">❌ ${data.error}</div>`;
      return;
    }

    const items = data.entries || [];
    if (items.length === 0) {
      resultsEl.innerHTML = '<div class="empty">📂 No notes in vault</div>';
      return;
    }

    const grouped = {};
    for (const item of items) {
      if (!grouped[item.layer]) grouped[item.layer] = [];
      grouped[item.layer].push(item);
    }

    resultsEl.innerHTML = Object.entries(grouped).map(([layer, notes]) => `
      <div style="margin-bottom: 16px;">
        <h3 style="color:#58a6ff;margin-bottom:8px;text-transform:uppercase;font-size:13px;">${layer} (${notes.length})</h3>
        ${notes.map(n => `
          <div class="note" style="margin-bottom:4px;padding:10px 16px;cursor:pointer" onclick="readNote('${n.layer}','${n.path.replace('.md','').split('/').slice(1).join('/')}')">
            <div class="note-header">
              <span class="note-path">${n.path}</span>
              <span class="note-layer">${n.indexed ? '📝' : '⚠️ Unindexed'}</span>
            </div>
          </div>
        `).join('')}
      </div>
    `).join('');
  } catch (err) {
    resultsEl.innerHTML = `<div class="error">❌ ${err.message}</div>`;
  }
}

async function readNote(layer, path) {
  const resultsEl = document.getElementById('results');
  resultsEl.innerHTML = '<div class="loading">⏳ Reading...</div>';

  try {
    const resp = await fetch(`${API_BASE}/api/read?layer=${encodeURIComponent(layer)}&path=${encodeURIComponent(path)}`);
    const data = await resp.json();

    if (data.error) {
      resultsEl.innerHTML = `<div class="error">❌ ${data.error}</div>`;
      return;
    }

    // Render as simple HTML (basic markdown-like rendering)
    const html = data.content
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/^### (.*$)/gm, '<h3 style="color:#f0883e;margin:12px 0 4px;">$1</h3>')
      .replace(/^## (.*$)/gm, '<h2 style="color:#f0883e;margin:16px 0 4px;">$1</h2>')
      .replace(/^# (.*$)/gm, '<h1 style="color:#f0883e;margin:20px 0 8px;">$1</h1>')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/^- (.*$)/gm, '<li style="margin-left:16px;color:#8b949e;">$1</li>')
      .replace(/\n\n/g, '</p><p style="margin:8px 0;color:#c9d1d9;">')
      .replace(/\n/g, '<br>');

    resultsEl.innerHTML = `
      <div>
        <button onclick="browseAll()" style="margin-bottom:12px;padding:6px 14px;border:1px solid #30363d;border-radius:6px;background:#161b22;color:#c9d1d9;cursor:pointer;">← Back to list</button>
        <div class="note">
          <div class="note-header">
            <span class="note-path">${data.layer}/${data.path}.md</span>
          </div>
          <div class="note-snippet" style="color:#c9d1d9;font-size:14px;line-height:1.6;margin-top:8px;">
            <p style="margin:0;">${html}</p>
          </div>
        </div>
      </div>
    `;
  } catch (err) {
    resultsEl.innerHTML = `<div class="error">❌ ${err.message}</div>`;
  }
}

function setLayer(btn, layer) {
  document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentLayer = layer;
}

async function search() {
  const query = document.getElementById('query').value.trim();
  if (!query) return;

  const resultsEl = document.getElementById('results');
  resultsEl.innerHTML = '<div class="loading">⏳ Searching...</div>';

  try {
    const params = new URLSearchParams({ query, top_k: '10' });
    if (currentLayer) params.set('layer', currentLayer);

    const resp = await fetch(`${API_BASE}/api/search?${params}`);
    const data = await resp.json();

    if (data.error) {
      resultsEl.innerHTML = `<div class="error">❌ ${data.error}</div>`;
      return;
    }

    const items = data.results || [];
    if (items.length === 0) {
      resultsEl.innerHTML = '<div class="empty">🔍 No results found</div>';
      return;
    }

    resultsEl.innerHTML = items.map(item => `
      <div class="note">
        <div class="note-header">
          <span class="note-path">${item.path}</span>
          <span class="note-layer">${item.layer}</span>
        </div>
        <div class="note-score">Score: ${item.score.toFixed(4)} | Chunk: ${item.chunk_index}</div>
        <div class="note-snippet">${escapeHtml(item.snippet || '(no snippet)')}</div>
      </div>
    `).join('');
  } catch (err) {
    resultsEl.innerHTML = `<div class="error">❌ Connection error: ${err.message}</div>`;
  }
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

checkStatus();
browseAll();
</script>
</body>
</html>
