<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 Brain Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; padding: 24px; }
  h1 { font-size: 24px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .subtitle { color: #8b949e; margin-bottom: 24px; font-size: 14px; }
  .status { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .status.online { background: #1a3a2a; color: #3fb950; }
  .status.degraded { background: #3a2e1a; color: #f0883e; }
  .status.offline { background: #3a1a1a; color: #f85149; }
  .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
  .search-box input { flex: 1; padding: 10px 16px; border: 1px solid #30363d; border-radius: 8px; background: #161b22; color: #c9d1d9; font-size: 14px; }
  .search-box button { padding: 10px 20px; border: none; border-radius: 8px; background: #238636; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  .search-box button:hover { background: #2ea043; }
  .layers { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .layer-btn { padding: 6px 16px; border: 1px solid #30363d; border-radius: 16px; background: transparent; color: #c9d1d9; font-size: 13px; cursor: pointer; }
  .layer-btn.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .layer-btn:hover { border-color: #58a6ff; }
  .results { display: flex; flex-direction: column; gap: 8px; }
  .note { padding: 16px; border: 1px solid #30363d; border-radius: 8px; background: #161b22; }
  .note-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .note-path { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; color: #58a6ff; }
  .note-layer { font-size: 11px; padding: 2px 8px; border-radius: 8px; background: #1f6feb22; color: #58a6ff; font-weight: 600; text-transform: uppercase; }
  .note-score { font-size: 12px; color: #8b949e; }
  .note-snippet { font-size: 13px; color: #8b949e; line-height: 1.5; margin-top: 4px; white-space: pre-wrap; }
  .empty { text-align: center; padding: 48px; color: #484f58; }
  .error { text-align: center; padding: 24px; color: #f85149; }
  .loading { text-align: center; padding: 24px; color: #8b949e; }
  #graph-canvas { display: block; }
  #graph-filter { max-width: 280px; }
  footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid #21262d; font-size: 12px; color: #484f58; text-align: center; }
</style>
</head>
<body>
<h1>🧠 Brain Viewer</h1>
<div class="subtitle">
  <span class="status" id="status">Checking connection...</span>
</div>

<div class="search-box">
  <input type="text" id="query" placeholder="Search the brain..." onkeydown="if(event.key==='Enter') search()">
  <button onclick="search()">Search</button>
  <button onclick="browseAllReset()" style="background:#1f6feb;">Browse All</button>
  <button onclick="renderGraph()" style="background:#f0883e;">Grafo</button>
</div>

<div class="layers">
  <button class="layer-btn active" data-layer="" onclick="setLayer(this, '')">All</button>
  <button class="layer-btn" data-layer="arquitetura" onclick="setLayer(this, 'arquitetura')">Arquitetura</button>
  <button class="layer-btn" data-layer="regras" onclick="setLayer(this, 'regras')">Regras</button>
  <button class="layer-btn" data-layer="sessoes" onclick="setLayer(this, 'sessoes')">Sessões</button>
  <button class="layer-btn" data-layer="projetos" onclick="setLayer(this, 'projetos')">Projetos</button>
</div>

<div id="results" class="results">
  <div class="empty">🔍 Search the brain to see results here</div>
</div>

<footer>
  Brain MCP Server — <span id="brain-url">http://localhost:8321</span>
</footer>

<script>
// The viewer server runs on port 8322 by default (BRAIN_VIEWER_PORT)
const API_BASE = location.origin;
document.getElementById('brain-url').textContent = API_BASE;

let currentLayer = '';

// Mapa de constelações do acervo (viewer-graph SPEC §7 — vinculante):
// fundo Noite #0d1117, labels Papel #c9d1d9 11px sistema, aresta wikilink
// sólida Link #58a6ff, aresta project trilha pontilhada Trilha #3fb950
// (dash 4/3), hub projeto quadrado Guia #f0883e 6px, nota círculo 3px,
// órfã círculo vazado Órfã #484f58, anel fino = camada (só hex da paleta;
// estudos/indexacao usam Órfã como fallback documentado em graphLayerRing).
// Física própria O(n2): repulsão + molas + gravidade central, pan/zoom por
// transform, hit-test por distância. Deriva lenta 0.2x após assentar;
// congela após GRAPH_FROZEN_TICKS se nós > GRAPH_FROZEN_AT (RF-12);
// estático sob prefers-reduced-motion. Sem deps, sem webfont, sem gradiente.
const GRAPH_FROZEN_AT = 1500;
const GRAPH_SETTLE_TICKS = 250;
const GRAPH_FROZEN_TICKS = 300;

let graphRaf = 0;
let graphFilter = '';
let graphNodes = [];
let graphEdges = [];
let graphTick = 0;
let graphFrozen = false;
let graphHover = -1;
let graphSelected = -1;
let graphPX = [];
let graphPY = [];
let graphVX = [];
let graphVY = [];
let graphDeg = [];
let graphHub = [];
let graphPanX = 0;
let graphPanY = 0;
let graphZoomK = 1;

function graphFilterChanged() {
  graphFilter = document.getElementById('graph-filter').value;
  renderGraph();
}

function graphLayerRing(layer) {
  if (layer === 'arquitetura') return '#58a6ff';
  if (layer === 'regras') return '#3fb950';
  if (layer === 'sessoes') return '#f0883e';
  if (layer === 'projetos') return '#c9d1d9';
  // Fallback intencional, não esquecimento: `estudos` e `indexacao` caem em
  // Órfã #484f58 porque a paleta (§7) é fechada em 6 hex e Noite #0d1117 é
  // invisível sobre o fundo. Sem colisão semântica com nó órfão: órfã é
  // círculo VAZADO sem anel (raio 3), camada-fallback é anel (raio 5) sobre
  // círculo preenchido. Sem cor nova por SPEC §7; se estudos/indexacao
  // ganharem volume, candidata a 7º hex vai para a SPEC, não para o código.
  return '#484f58';
}

function stopGraph() {
  if (graphRaf) { cancelAnimationFrame(graphRaf); graphRaf = 0; }
}

async function checkStatus() {
  const statusEl = document.getElementById('status');
  try {
    const resp = await fetch(`${API_BASE}/api/status`, { signal: AbortSignal.timeout(3000) });
    if (resp.ok) {
      const data = await resp.json();
      // A 200 carrying {"error": ...} is a broken DB, not a healthy server.
      // Labelling it "offline" would blame the viewer for the store's failure.
      if (data.error) {
        statusEl.className = 'status offline';
        statusEl.textContent = `🔴 Status error · ${data.error}`;
        return;
      }
      // TD-008. The response used to be fetched and discarded, so the counts
      // this line advertises were never the ones on screen. Coverage is the
      // field that matters: `notes`/`chunks` stayed perfectly healthy while the
      // vector index was 99.6% BLOB-of-zeros and semantic search scored 0.0.
      const cov = (data.embedding && data.embedding.coverage) || {};
      const pct = cov.embedding_coverage_pct;
      const full = typeof pct === 'number' && pct >= 100;
      statusEl.className = 'status ' + (full ? 'online' : 'degraded');
      let text = `🟢 Online · ${data.notes} notes · ${data.chunks} chunks · ${data.projects} projects`;
      if (typeof pct === 'number') {
        text += ` · embedding ${pct}%`;
        if (!full) text += ` (${cov.chunks_without_embedding} awaiting embed)`;
      } else {
        text += ' · embedding ?';
      }
      statusEl.textContent = text;
      // No Ollama dot here, on purpose. /api/status is a read-only path and
      // brain-web takes no network dependency; a liveness probe is on the MCP
      // tool `brain_status`. An earlier version showed `data.ollama_ok`, a field
      // the endpoint never returned, so the dot was permanently yellow and the
      // line read "undefined entries" — a badge that cannot be wrong is not a
      // diagnostic.
      statusEl.title = 'Ollama liveness is not reported here (read-only endpoint, no network dependency). Check the MCP tool brain_status or: journalctl -u brain-mcp.service';
    }
  } catch {
    statusEl.className = 'status offline';
      statusEl.textContent = '🔴 Viewer offline';
  }
}

async function browseAll() {
  stopGraph();
  const resultsEl = document.getElementById('results');
  resultsEl.innerHTML = '<div class="loading">⏳ Loading notes...</div>';

  try {
    const resp = await fetch(`${API_BASE}/api/list`);
    const data = await resp.json();

    if (data.error) {
      resultsEl.innerHTML = `<div class="error">❌ ${data.error}</div>`;
      return;
    }

    const items = data.entries || [];
    if (items.length === 0) {
      resultsEl.innerHTML = '<div class="empty">📂 No notes in vault</div>';
      return;
    }

    // currentLayer filters the browse list (pills); "" = all layers.
    // Skip-in-loop on purpose: items.filter/push would add member reads the
    // brain-web wiring guard flags as phantom (TD-011) — only served fields
    // (entries/layer/path/chunks_total/chunks_embedded) are read here.
    const layer = currentLayer;
    const grouped = {};
    for (const item of items) {
      if (layer && item.layer !== layer) continue;
      if (!grouped[item.layer]) grouped[item.layer] = [];
      grouped[item.layer].push(item);
    }
    if (Object.keys(grouped).length === 0) {
      resultsEl.innerHTML = layer
        ? `<div class="empty">📂 No notes in layer ${layer}</div>`
        : '<div class="empty">📂 No notes in vault</div>';
      return;
    }

    // TD-011. The badge used to read `n.indexed`, a field /api/list has never
    // served, so `undefined` fell through to the false branch and every note
    // carried a permanent, meaningless "⚠️ Unindexed".
    //
    // The endpoint now serves the same two counts `/api/status` publishes, and
    // the state is derived here — which also means the default branch is no
    // longer "something is wrong". A field that is absent is *unknown*, and
    // unknown renders as no badge at all: a warning that fires on missing data
    // is this bug wearing a different hat.
    const badge = n => {
      const total = n.chunks_total, emb = n.chunks_embedded;
      if (typeof total !== 'number' || typeof emb !== 'number') return '';
      if (emb > 0) return '<span class="note-layer" title="Semantically searchable">📝</span>';
      if (total > 0) {
        return `<span class="note-layer" title="${total} chunk(s) queued for embedding — findable by text search, not by semantic search">⚠️ FTS only</span>`;
      }
      // No chunk rows at all. A different fault from a backlogged queue, so it
      // says so instead of borrowing the queue's wording.
      return '<span class="note-layer" title="No chunks — this note is not indexed for either search half">⚠️ No chunks</span>';
    };

    resultsEl.innerHTML = Object.entries(grouped).map(([layer, notes]) => `
      <div style="margin-bottom: 16px;">
        <h3 style="color:#58a6ff;margin-bottom:8px;text-transform:uppercase;font-size:13px;">${layer} (${notes.length})</h3>
        ${notes.map(n => `
          <div class="note" style="margin-bottom:4px;padding:10px 16px;cursor:pointer" onclick="readNote('${n.path}')">
            <div class="note-header">
              <span class="note-path">${n.path}</span>
              ${badge(n)}
            </div>
          </div>
        `).join('')}
      </div>
    `).join('');
  } catch (err) {
    resultsEl.innerHTML = `<div class="error">❌ ${err.message}</div>`;
  }
}

async function readNote(path) {
  stopGraph();
  const resultsEl = document.getElementById('results');
  resultsEl.innerHTML = '<div class="loading">⏳ Reading...</div>';

  // `path` is `notes.path` verbatim — the layer is its first segment, not
  // something to strip. /api/read matches that column exactly, so the browse
  // list used to hand it a path with the layer removed and every click came back
  // "not found". The `.replace('.md','')` was dead too: paths are stored
  // extensionless.
  try {
    const resp = await fetch(`${API_BASE}/api/read?path=${encodeURIComponent(path)}`);
    const data = await resp.json();

    if (data.error) {
      resultsEl.innerHTML = `<div class="error">❌ ${data.error}</div>`;
      return;
    }

    // Render as simple HTML (basic markdown-like rendering)
    const html = data.content
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/^### (.*$)/gm, '<h3 style="color:#f0883e;margin:12px 0 4px;">$1</h3>')
      .replace(/^## (.*$)/gm, '<h2 style="color:#f0883e;margin:16px 0 4px;">$1</h2>')
      .replace(/^# (.*$)/gm, '<h1 style="color:#f0883e;margin:20px 0 8px;">$1</h1>')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/^- (.*$)/gm, '<li style="margin-left:16px;color:#8b949e;">$1</li>')
      .replace(/\n\n/g, '</p><p style="margin:8px 0;color:#c9d1d9;">')
      .replace(/\n/g, '<br>');

    resultsEl.innerHTML = `
      <div>
        <button onclick="browseAll()" style="margin-bottom:12px;padding:6px 14px;border:1px solid #30363d;border-radius:6px;background:#161b22;color:#c9d1d9;cursor:pointer;">← Back to list</button>
        <div class="note">
          <div class="note-header">
            <span class="note-path">${data.layer}/${data.path}.md</span>
          </div>
          <div class="note-snippet" style="color:#c9d1d9;font-size:14px;line-height:1.6;margin-top:8px;">
            <p style="margin:0;">${html}</p>
          </div>
        </div>
      </div>
    `;
  } catch (err) {
    resultsEl.innerHTML = `<div class="error">❌ ${err.message}</div>`;
  }
}

function setLayer(btn, layer) {
  document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentLayer = layer;
  browseAll();
}

function browseAllReset() {
  const allBtn = document.querySelector('.layer-btn[data-layer=""]');
  if (allBtn) {
    document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
    allBtn.classList.add('active');
  }
  currentLayer = '';
  browseAll();
}

async function search() {
  stopGraph();
  const query = document.getElementById('query').value.trim();
  if (!query) return;

  const resultsEl = document.getElementById('results');
  resultsEl.innerHTML = '<div class="loading">⏳ Searching...</div>';

  try {
    const params = new URLSearchParams({ query, top_k: '10' });
    if (currentLayer) params.set('layer', currentLayer);

    const resp = await fetch(`${API_BASE}/api/search?${params}`);
    const data = await resp.json();

    if (data.error) {
      resultsEl.innerHTML = `<div class="error">❌ ${data.error}</div>`;
      return;
    }

    const items = data.results || [];
    if (items.length === 0) {
      resultsEl.innerHTML = '<div class="empty">🔍 No results found</div>';
      return;
    }

    resultsEl.innerHTML = items.map(item => `
      <div class="note">
        <div class="note-header">
          <span class="note-path">${item.path}</span>
          <span class="note-layer">${item.layer}</span>
        </div>
        <div class="note-score">Score: ${item.score.toFixed(4)} | Chunk: ${item.chunk_index}</div>
        <div class="note-snippet">${escapeHtml(item.snippet || '(no snippet)')}</div>
      </div>
    `).join('');
  } catch (err) {
    resultsEl.innerHTML = `<div class="error">❌ Connection error: ${err.message}</div>`;
  }
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  // textContent→innerHTML escapa & < > mas NÃO aspas: serialização de nó de
  // texto não escapa `"` (só faria sentido em atributo). O dropdown do grafo
  // interpola em value="…", então `"` quebraria o atributo (projeto com `"`
  // no nome injetaria markup). Escapar aqui é seguro nos dois contextos:
  // em texto `&quot;` renderiza como `"`, em atributo volta a `"` no parse.
  // split/join em vez de replace(/"/g,…): o guard de wiring do viewer faz
  // lex do JS sem entender regex, e a `"` dentro de /"/ abriria string que
  // nunca fecha (apagaria `renderGraph` da visão do teste).
  return d.innerHTML.split('"').join('&quot;');
}

async function renderGraph() {
  stopGraph();
  const resultsEl = document.getElementById('results');
  resultsEl.innerHTML =
    '<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;">' +
    '<label for="graph-filter" style="font-size:13px;color:#8b949e;">Projeto</label>' +
    '<select id="graph-filter" onchange="graphFilterChanged()" style="padding:6px 10px;border:1px solid #30363d;border-radius:8px;background:#161b22;color:#c9d1d9;font-size:13px;"><option value="">todos</option></select>' +
    '<span id="graph-count" style="font-size:12px;color:#8b949e;">a carregar grafo…</span>' +
    '</div>' +
    '<canvas id="graph-canvas" title="grafo do acervo" style="width:100%;height:520px;border:1px solid #30363d;border-radius:8px;background:#0d1117;cursor:grab;"></canvas>' +
    '<div style="font-size:12px;color:#484f58;margin-top:8px;">arrastar = pan · roda = zoom · clique num ponto = ler nota · clique num quadrado = filtrar projeto</div>';
  const countEl = document.getElementById('graph-count');
  const cv = document.getElementById('graph-canvas');
  const ctx = cv.getContext('2d');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches === true;
  let resp;
  try {
    resp = await fetch(`${API_BASE}/api/graph?project=` + encodeURIComponent(graphFilter), { signal: AbortSignal.timeout(3000) });
  } catch (err) {
    countEl.textContent = 'grafo indisponível: ' + err.message;
    return;
  }
  const data = await resp.json();
  if (data.error) {
    countEl.textContent = 'erro no grafo: ' + data.error;
    return;
  }
  const nodes = data.nodes;
  const edges = data.edges;
  const dangling = data.dangling;
  const projects = data.projects;
  graphNodes = nodes;
  graphEdges = edges;
  let opts = '<option value="">todos</option>';
  for (const p of projects) {
    const sel = p === graphFilter ? ' selected' : '';
    opts += '<option value="' + escapeHtml(p) + '"' + sel + '>' + escapeHtml(p) + '</option>';
  }
  document.getElementById('graph-filter').innerHTML = opts;
  const n = nodes.length;
  const idx = {};
  graphPX = [];
  graphPY = [];
  graphVX = [];
  graphVY = [];
  graphDeg = [];
  graphHub = [];
  for (let i = 0; i < n; i++) {
    const nd = nodes[i];
    idx[nd.id] = i;
    graphPX[i] = (Math.random() - 0.5) * 600;
    graphPY[i] = (Math.random() - 0.5) * 600;
    graphVX[i] = 0;
    graphVY[i] = 0;
    graphDeg[i] = 0;
    graphHub[i] = false;
  }
  for (const e of edges) {
    const a = idx[e.from];
    const b = idx[e.to];
    if (a === undefined || b === undefined) continue;
    graphDeg[a] += 1;
    graphDeg[b] += 1;
  }
  for (let t = 0; t < 5; t++) {
    let best = -1;
    for (let i = 0; i < n; i++) {
      if (graphHub[i]) continue;
      if (nodes[i].kind !== 'note') continue;
      if (best < 0 || graphDeg[i] > graphDeg[best]) best = i;
    }
    if (best < 0) break;
    graphHub[best] = true;
  }
  graphTick = 0;
  graphFrozen = false;
  graphHover = -1;
  graphSelected = -1;
  graphPanX = 0;
  graphPanY = 0;
  graphZoomK = 1;
  const frozenAt = n > GRAPH_FROZEN_AT;
  const maxTicks = frozenAt ? GRAPH_FROZEN_TICKS : GRAPH_SETTLE_TICKS;
  let tipShown = '';
  let dragX = 0;
  let dragY = 0;
  let dragging = false;
  let moved = 0;
  function physics(mul) {
    for (let i = 0; i < n; i++) {
      let fx = -graphPX[i] * 0.01 * mul;
      let fy = -graphPY[i] * 0.01 * mul;
      for (let j = 0; j < n; j++) {
        if (i === j) continue;
        const dx = graphPX[i] - graphPX[j];
        const dy = graphPY[i] - graphPY[j];
        let d2 = dx * dx + dy * dy;
        if (d2 < 1) d2 = 1;
        const d = Math.sqrt(d2);
        const f = 900 * mul / d2;
        fx += dx / d * f;
        fy += dy / d * f;
      }
      graphVX[i] = (graphVX[i] + fx) * 0.85;
      graphVY[i] = (graphVY[i] + fy) * 0.85;
    }
    for (const e of edges) {
      const a = idx[e.from];
      const b = idx[e.to];
      if (a === undefined || b === undefined) continue;
      const dx = graphPX[b] - graphPX[a];
      const dy = graphPY[b] - graphPY[a];
      const d = Math.sqrt(dx * dx + dy * dy) + 0.01;
      const f = (d - 90) * 0.02 * mul;
      graphVX[a] += dx / d * f;
      graphVY[a] += dy / d * f;
      graphVX[b] -= dx / d * f;
      graphVY[b] -= dy / d * f;
    }
    for (let i = 0; i < n; i++) {
      graphPX[i] += graphVX[i];
      graphPY[i] += graphVY[i];
    }
  }
  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth || 800;
    const h = 520;
    if (cv.width !== Math.round(w * dpr)) cv.width = Math.round(w * dpr);
    if (cv.height !== Math.round(h * dpr)) cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    for (const e of edges) {
      const a = idx[e.from];
      const b = idx[e.to];
      if (a === undefined || b === undefined) continue;
      const x1 = (graphPX[a] + graphPanX) * graphZoomK + w / 2;
      const y1 = (graphPY[a] + graphPanY) * graphZoomK + h / 2;
      const x2 = (graphPX[b] + graphPanX) * graphZoomK + w / 2;
      const y2 = (graphPY[b] + graphPanY) * graphZoomK + h / 2;
      if (e.kind === 'project') {
        ctx.strokeStyle = 'rgba(63, 185, 80, 0.35)';
        ctx.setLineDash([4, 3]);
      } else {
        ctx.strokeStyle = 'rgba(88, 166, 255, 0.35)';
        ctx.setLineDash([]);
      }
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    let vis = 0;
    for (let i = 0; i < n; i++) {
      const nd = nodes[i];
      const x = (graphPX[i] + graphPanX) * graphZoomK + w / 2;
      const y = (graphPY[i] + graphPanY) * graphZoomK + h / 2;
      if (x < -20 || y < -20 || x > w + 20 || y > h + 20) continue;
      vis++;
      const isHub = nd.kind !== 'note';
      const orphan = !isHub && graphDeg[i] === 0;
      const sel = i === graphSelected || i === graphHover;
      if (isHub) {
        ctx.fillStyle = '#f0883e';
        ctx.fillRect(x - 3, y - 3, 6, 6);
      } else if (orphan) {
        ctx.strokeStyle = '#484f58';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, 6.2832);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#c9d1d9';
        ctx.beginPath();
        ctx.arc(x, y, sel ? 4 : 3, 0, 6.2832);
        ctx.fill();
        ctx.strokeStyle = graphLayerRing(nd.layer);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, 6.2832);
        ctx.stroke();
      }
      const showLabel = isHub || graphHub[i] || sel || graphZoomK > 1.5;
      if (showLabel) {
        ctx.font = '11px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';
        ctx.fillStyle = '#c9d1d9';
        ctx.fillText(nd.label, x + 8, y + 4);
      }
    }
    const state = graphFrozen ? 'layout congelado' : 'simulando';
    let txt = n + ' nós · ' + state;
    if (graphZoomK !== 1) txt = vis + '/' + n + ' visíveis · ' + state;
    txt += ' · ' + dangling + ' dangling';
    if (graphFilter !== '') txt += ' · ' + graphFilter;
    countEl.textContent = txt;
  }
  function fullTip(nd) {
    if (nd.kind === 'project') return nd.id;
    return nd.id + ' · ' + nd.layer;
  }
  function pick(ev) {
    const rect = cv.getBoundingClientRect();
    const mx = ev.clientX - rect.left;
    const my = ev.clientY - rect.top;
    const w = rect.width;
    const h = rect.height;
    let best = -1;
    let bestD = 144;
    for (let i = 0; i < n; i++) {
      const x = (graphPX[i] + graphPanX) * graphZoomK + w / 2;
      const y = (graphPY[i] + graphPanY) * graphZoomK + h / 2;
      const dx = mx - x;
      const dy = my - y;
      const d = dx * dx + dy * dy;
      const rr = nodes[i].kind === 'note' ? 9 : 12;
      if (d < rr * rr && (best < 0 || d < bestD)) { best = i; bestD = d; }
    }
    return best;
  }
  function clickNode(i) {
    const nd = nodes[i];
    graphSelected = i;
    if (nd.kind === 'project') {
      graphFilter = nd.label;
      renderGraph();
    } else {
      draw();
      readNote(nd.id);
    }
  }
  function frame() {
    if (graphTick < maxTicks) {
      physics(1);
    } else if (!frozenAt) {
      physics(0.2);
    } else {
      graphFrozen = true;
      draw();
      graphRaf = 0;
      return;
    }
    graphTick++;
    draw();
    graphRaf = requestAnimationFrame(frame);
  }
  cv.onmousedown = function (ev) {
    dragX = ev.clientX;
    dragY = ev.clientY;
    dragging = true;
    moved = 0;
  };
  cv.onmousemove = function (ev) {
    if (dragging) {
      const dx = ev.clientX - dragX;
      const dy = ev.clientY - dragY;
      moved += Math.abs(dx) + Math.abs(dy);
      graphPanX += dx / graphZoomK;
      graphPanY += dy / graphZoomK;
      dragX = ev.clientX;
      dragY = ev.clientY;
      draw();
    } else {
      const hit = pick(ev);
      const tip = hit >= 0 ? fullTip(nodes[hit]) : '';
      if (tip !== tipShown) {
        tipShown = tip;
        cv.title = tip === '' ? 'grafo do acervo' : tip;
      }
      if (hit !== graphHover) { graphHover = hit; draw(); }
    }
  };
  cv.onmouseup = function (ev) {
    dragging = false;
    if (moved < 5) {
      const hit = pick(ev);
      if (hit >= 0) clickNode(hit);
      else { graphSelected = -1; draw(); }
    }
  };
  cv.onwheel = function (ev) {
    ev.preventDefault();
    const f = ev.deltaY < 0 ? 1.15 : 1 / 1.15;
    graphZoomK = Math.min(4, Math.max(0.2, graphZoomK * f));
    draw();
  };
  if (reduced) {
    for (let s = 0; s < 30; s++) physics(1);
    draw();
  } else {
    graphRaf = requestAnimationFrame(frame);
  }
}

checkStatus();
browseAll();
</script>
</body>
</html>
