[package]
name = "brain-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "brain"
path = "src/main.rs"

[dependencies]
brain-core = { path = "../brain-core" }
brain-store = { path = "../brain-store" }
brain-embed = { path = "../brain-embed" }
brain-web = { path = "../brain-web" }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
walkdir = "2"
axum = { version = "0.7", features = ["json", "macros"] }
fs2 = "0.4"
brain-mcp = { path = "../brain-mcp" }
tar = "0.4.46"
flate2 = "1.1.10"

[dev-dependencies]
serde_json = "1"
