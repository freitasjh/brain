[package]
name = "brain-mcp"
version.workspace = true
edition.workspace = true

[dependencies]
brain-core = { path = "../brain-core" }
brain-store = { path = "../brain-store" }
brain-embed = { path = "../brain-embed" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
axum = { version = "0.7", features = ["json", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
tower = "0.5"

rmcp = { version = "=0.5.0", features = ["server", "macros", "transport-sse-server", "transport-streamable-http-server", "transport-io", "schemars"] }
schemars = "1"
# rmcp 0.5 serves its own transports with **axum 0.8** while this crate's debug
# REST router is axum 0.7 — both versions already coexist in the workspace
# (`Cargo.lock` has axum 0.7.9 and 0.8.9), so this alias compiles no extra crate.
# It is here for exactly one call: the MCP router that carries the legacy SSE
# transport (`/sse`, `/message`) is built by rmcp and is therefore an axum **0.8**
# `Router`, so only axum 0.8's `serve` can run it. `StreamableHttpService` is a
# plain `tower::Service` and nests into either version's router, which is why one
# service instance can back both the 0.8 production app and the 0.7 debug router.
axum08 = { package = "axum", version = "0.8" }
# `CancellationToken` is the cancellation primitive rmcp's `SseServerConfig` takes
# and returns, so the token we hand out to shut the composed server down is one of
# its own. Already in the workspace as a transitive dependency of rmcp.
tokio-util = "0.7"

[dev-dependencies]
# Local mock Ollama for the queue tests. axum is already a direct dependency of
# this crate at the same version, so this adds no new transitive dependency to
# the workspace; it only makes the `axum` handle available to the test crate,
# which links against the library rather than its dependency list.
axum = { version = "0.7", features = ["json"] }
# X-05.2. The export containment test needs to plant a note whose stored `path`
# escapes the export root. No API can produce one — `sanitize_relative_path`
# rejects `..` at write time, which is the point — so the row has to go in
# directly, simulating a database written by an older build or a migration.
# Pinned to the same version and `bundled` strategy brain-store uses, so this adds
# no second copy of libsqlite3 to the workspace and does not touch the vendored
# `sqlite3_vec` extension build described below.
rusqlite = { version = "0.32", features = ["bundled"] }
